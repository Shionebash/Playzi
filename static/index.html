<!doctype html>
<html lang="es" data-theme="dark" data-color="pink">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playzi</title>
  <link rel="icon" href="/static/assets/playzi-logo.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/static/playzi-theme-init.js"></script>
  <link rel="stylesheet" href="/static/styles.css?v=8">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <img class="logo-icon" src="/static/assets/playzi-logo.png?v=2" alt="Playzi">
        <div class="logo-text">Playzi</div>
      </div>
      <button type="button" class="nav-item active" data-view="home"><span>⌂</span><span>Inicio</span></button>
      <button type="button" class="nav-item" data-view="search"><span>⌕</span><span>Buscar</span></button>
      <button type="button" class="nav-item" data-view="recom"><span>★</span><span>Para ti</span></button>
      <button type="button" class="nav-item" data-view="channels"><span>◎</span><span>Canales</span></button>
      <button type="button" class="nav-item" data-view="library"><span>▣</span><span>Biblioteca</span></button>
      <button type="button" class="nav-item" data-view="music"><span>♪</span><span>Música</span></button>
      <button type="button" class="nav-item" data-view="collections"><span>▥</span><span>Colecciones</span></button>
      <button type="button" class="nav-item" data-view="downloads"><span>↓</span><span>Descargas</span><b id="downloadBadge"></b></button>
      <button type="button" class="nav-item" data-view="history"><span>↺</span><span>Historial</span></button>
      <button type="button" class="nav-item" data-view="config"><span>⚙</span><span>Configuración</span></button>
      <div class="sidebar-bottom">
        <button type="button" class="nav-item auth-status auth-off" id="authStatus" title="Inicia sesión en YouTube"><span class="auth-dot"></span><span class="auth-label">No conectado</span></button>
        <button type="button" class="nav-item" id="themeBtn"><span id="themeIcon" style="display:flex;align-items:center;justify-content:center;width:20px;flex-shrink:0"></span><span>Tema</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <button type="button" id="sidebarToggle" class="icon-btn" title="Mostrar/ocultar barra">☰</button>
        <div class="search-wrap">
          <span>⌕</span>
          <input id="searchInput" class="search-input" placeholder="Buscar en YouTube o pega una URL...">
          <button type="button" id="clearSearch" class="icon-btn" title="Limpiar">×</button>
        </div>
        <button type="button" id="directPlay" class="btn btn-ghost">Reproducir</button>
      </header>

      <section class="content">
        <div id="view-home" class="view"></div>
        <div id="view-search" class="view hidden"></div>
        <div id="view-watch" class="view hidden"></div>
        <div id="view-recom" class="view hidden"></div>
        <div id="view-channels" class="view hidden"></div>
        <div id="view-library" class="view hidden"></div>
        <div id="view-music" class="view hidden"></div>
        <div id="view-collections" class="view hidden"></div>
        <div id="view-downloads" class="view hidden"></div>
        <div id="view-history" class="view hidden"></div>
        <div id="view-config" class="view hidden"></div>
      </section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="playerRoot"></div>
  <div id="toast" class="toast hidden"></div>
  <link rel="stylesheet" href="/static/vendor/video-js.min.css">
  <script defer src="/static/vendor/video.min.js"></script>
  <script defer src="/static/app.js?v=9"></script>
</body>
</html>
